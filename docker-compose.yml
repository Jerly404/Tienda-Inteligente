services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tienda_inteligente
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda -d tienda_inteligente"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
